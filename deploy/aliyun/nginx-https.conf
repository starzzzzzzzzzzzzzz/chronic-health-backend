# Installed in /etc/nginx/conf.d/chronic-health.conf (inside http context).
# Explicit browser origins; add a partner's confirmed origin here when needed.
map $http_origin $health_cors_origin {
    default "";
    "https://120.26.14.242" $http_origin;
    "http://116.178.155.215:18006" $http_origin;
    ~^http://(localhost|127\.0\.0\.1):(5173|9090|3000|8080)$ $http_origin;
}
map "$http_origin|$health_cors_origin" $health_cors_rejected {
    default 0;
    ~^.+\|$ 1;
}
limit_req_zone $binary_remote_addr zone=health_api:1m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=health_connections:1m;

server {
    listen 80;
    server_name 120.26.14.242;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://120.26.14.242$request_uri; }
}

server {
    listen 443 ssl;
    server_name 120.26.14.242;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/120.26.14.242/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/120.26.14.242/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:health_tls:1m;
    ssl_session_timeout 10m;
    client_max_body_size 1m;
    client_body_timeout 15s;
    keepalive_timeout 30s;
    limit_req_status 429;
    limit_conn_status 429;

    location = / { return 302 /ncd-ai/doc.html; }
    location = /ncd-ai/ { return 302 /ncd-ai/doc.html; }
    location ^~ /ncd-ai/actuator/ { return 404; }
    location /ncd-ai/ {
        if ($health_cors_rejected) { return 403; }
        add_header Access-Control-Allow-Origin $health_cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Idempotency-Key, X-Request-Id" always;
        add_header Access-Control-Expose-Headers "Location, X-Request-Id, Retry-After" always;
        add_header Access-Control-Max-Age 600 always;
        add_header Vary Origin always;
        add_header X-Content-Type-Options nosniff always;
        if ($request_method = OPTIONS) { return 204; }
        limit_req zone=health_api burst=40 nodelay;
        limit_conn health_connections 20;
        proxy_pass http://127.0.0.1:9089;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
        proxy_send_timeout 30s;
    }
    location / { return 404; }
}
