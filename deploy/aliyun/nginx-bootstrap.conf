# Temporary HTTP server: ACME validation only, never proxies application traffic.
server {
    listen 80;
    server_name 120.26.14.242;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 404; }
}
